# Render Blueprint: free web services for the project's two APIs
# https://render.com/docs/blueprint-spec
services:
  # Replays a holdout of card transactions (the pipeline's data source)
  - type: web
    name: fraud-transactions-api
    runtime: docker
    plan: free
    rootDir: transactions-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - transactions-api/**

  # Serves the fraud detection model (scikit-learn pipeline)
  - type: web
    name: fraud-model-api
    runtime: docker
    plan: free
    rootDir: model-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - model-api/**
